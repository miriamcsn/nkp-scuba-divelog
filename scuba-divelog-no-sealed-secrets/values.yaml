# Image registry + pull policy shared by both components
image:
  registry: ghcr.io/miriamcsn
  pullPolicy: IfNotPresent

# Backend: FastAPI + MySQL, single replica
backend:
  image:
    repository: scuba-divelog-backend
    tag: "0.2.0"
  replicaCount: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: nutanix-volume
    mountPath: /data

# Frontend: nginx serving static HTML + proxying /api to the backend
frontend:
  image:
    repository: scuba-divelog-frontend
    tag: "17db1ed"
  replicaCount: 2
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Ingress (Traefik via NKP Kommander).
# host left empty on purpose: no scubadivelog.online rule — the app is only
# reachable through the ingress/LoadBalancer IP directly, not a hostname.
ingress:
  enabled: true
  className: kommander-traefik
  host: ""
  path: /
  pathType: Prefix

# MySQL settings. Credentials are hardcoded directly in templates/mysql-secret.yaml
# and templates/backend-db-secret.yaml as plain (unsealed) Secret objects —
# this chart intentionally has no sealed-secrets dependency.
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  persistence:
    storageClass: "nutanix-volume"
    size: 8Gi
