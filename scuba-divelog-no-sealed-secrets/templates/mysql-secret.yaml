# Plain Secret with hardcoded credentials — no sealed-secrets / bitnami
# controller dependency. Demo credentials only, matches compose.yml.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ .Release.Name }}-mysql
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  mysql-root-password: rootpw
  mysql-user: divelog
  mysql-password: divelog
  mysql-database: divelog
