# Plain Secret with hardcoded credentials — no sealed-secrets / bitnami
# controller dependency. Demo credentials only, matches compose.yml.
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ .Release.Name }}-app-db
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://divelog:divelog@{{ .Release.Name }}-mysql:3306/divelog"
{{- end }}
